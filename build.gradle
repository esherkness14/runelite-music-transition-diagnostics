plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Match the official example-plugin: development builds follow the newest
// published RuneLite release instead of pinning an old API snapshot.
def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.esherkness.musictransitiondiagnostics.MusicTransitionDiagnosticsPluginTest'

// The native probe is deliberately outside main/test plugin output. Its ASM
// dependencies and premain must never enter the ordinary plugin/shadow jars.
sourceSets {
	coreProbe
	coreProbeTest {
		compileClasspath += sourceSets.coreProbe.output
		runtimeClasspath += sourceSets.coreProbe.output
	}
}

configurations.coreProbeTestImplementation.extendsFrom(configurations.coreProbeImplementation)

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

	coreProbeImplementation 'org.ow2.asm:asm:9.10.1'
	coreProbeImplementation 'org.ow2.asm:asm-tree:9.10.1'
	coreProbeTestImplementation 'junit:junit:4.13.2'
}

group = 'com.esherkness.musictransitiondiagnostics'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// This launcher lives in the test source set, just like the official
// runelite/example-plugin template. It loads this external plugin and then
// starts the normal RuneLite development client.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// Deliberately separate from run: only this opt-in launcher asks the verified
// native probe to tune the four timings of the exact observed area signature.
tasks.register('runAreaFadeTest', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
	description = 'Run the dev client with bounded opt-in area and zero-timing tests.'
	group = 'application'
}

def coreProbeJar = tasks.register('coreProbeJar', Jar) {
	archiveFileName.set('music-transition-core-probe-agent.jar')
	destinationDirectory.set(layout.buildDirectory.dir('libs'))
	from sourceSets.coreProbe.output
	from { configurations.coreProbeRuntimeClasspath.collect { zipTree(it) } }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', '**/module-info.class'
	manifest {
		attributes('Premain-Class': 'com.esherkness.musictransitiondiagnostics.coreprobe.CoreProbeAgent',
			'Can-Redefine-Classes': 'false', 'Can-Retransform-Classes': 'false')
	}
}

// Share this wiring with the no-login smoke test so it tests real -javaagent
// packaging/attachment, not just a mocked transformer. The mode supplier runs
// only for the task being launched; normal run never reads the tuning property.
def attachCoreProbe = { JavaExec task, String logName, Closure<String> agentMode ->
	task.dependsOn(coreProbeJar)
	task.doFirst {
		def agentArgument = '-javaagent:' + coreProbeJar.get().archiveFile.get().asFile.absolutePath
		if (agentMode != null) {
			agentArgument += '=' + agentMode.call()
		}
		task.jvmArgs(agentArgument)
		task.systemProperty('musicCoreProbe.log', layout.buildDirectory.file(logName).get().asFile.absolutePath)
	}
}
tasks.named('run', JavaExec) { attachCoreProbe(it, 'music-core-probe.log', null) }
tasks.named('runAreaFadeTest', JavaExec) {
	attachCoreProbe(it, 'music-core-probe.log', {
		def timingProperties = [
			areaOutgoingDelay: '0', areaOutgoingFade: '60',
			areaIncomingDelay: '0', areaIncomingFade: '120'
		]
		def timings = timingProperties.collect { name, fallback ->
			def value = providers.gradleProperty(name).orElse(fallback).get()
			if (!(value ==~ /(0|[1-9][0-9]{0,2})/) || Integer.parseInt(value) > 300) {
				throw new GradleException("${name} must be an integer from 0 to 300 native scheduler steps")
			}
			value
		}
		def naturalIncomingFade = providers.gradleProperty('naturalIncomingFade').orElse('200').get()
		if (!(naturalIncomingFade ==~ /(0|[1-9][0-9]{0,2})/)
			|| Integer.parseInt(naturalIncomingFade) > 300) {
			throw new GradleException('naturalIncomingFade must be an integer from 0 to 300 native scheduler steps')
		}
		def volumeProbe = providers.gradleProperty('probeStreamVolume').orElse('false').get()
		if (volumeProbe != 'true' && volumeProbe != 'false') {
			throw new GradleException('probeStreamVolume must be exactly true or false')
		}
		return 'area-incoming-fade-test:' + timings.join(':') + ':' + naturalIncomingFade + ':' + volumeProbe
	})
}

tasks.register('coreProbeTest', Test) {
	dependsOn coreProbeJar
	testClassesDirs = sourceSets.coreProbeTest.output.classesDirs
	classpath = sourceSets.coreProbeTest.runtimeClasspath
	useJUnit()
	doFirst {
		systemProperty 'probe.agentJar', coreProbeJar.get().archiveFile.get().asFile.absolutePath
		systemProperty 'probe.testClasspath', sourceSets.coreProbeTest.runtimeClasspath.asPath
	}
}

tasks.register('coreProbeSmokeTest', JavaExec) {
	dependsOn tasks.named('coreProbeTestClasses')
	classpath = sourceSets.coreProbeTest.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass = 'com.esherkness.musictransitiondiagnostics.coreprobe.ProbeSmokeMain'
	jvmArgs '-Xverify:all'
	attachCoreProbe(it, 'test-results/core-probe-smoke.log', null)
}

tasks.register('coreProbeAreaFadeSmokeTest', JavaExec) {
	dependsOn tasks.named('coreProbeTestClasses')
	classpath = sourceSets.coreProbeTest.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass = 'com.esherkness.musictransitiondiagnostics.coreprobe.ProbeSmokeMain'
	jvmArgs '-Xverify:all'
	attachCoreProbe(it, 'test-results/core-probe-area-fade-smoke.log', { 'area-incoming-fade-test:0:60:0:120:200:false' })
}

tasks.register('coreProbeVolumeSmokeTest', JavaExec) {
	dependsOn tasks.named('coreProbeTestClasses')
	classpath = sourceSets.coreProbeTest.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass = 'com.esherkness.musictransitiondiagnostics.coreprobe.ProbeSmokeMain'
	jvmArgs '-Xverify:all'
	attachCoreProbe(it, 'test-results/core-probe-volume-smoke.log', { 'area-incoming-fade-test:0:60:0:120:200:true' })
}

tasks.register('coreProbeClosedSmokeTest', JavaExec) {
	dependsOn tasks.named('coreProbeTestClasses')
	// Intentionally omit the injected client: premain must not abort main.
	classpath = sourceSets.coreProbeTest.runtimeClasspath
	mainClass = 'com.esherkness.musictransitiondiagnostics.coreprobe.ProbeSmokeMain'
	args 'expect-disabled'
	attachCoreProbe(it, 'test-results/core-probe-closed-smoke.log', null)
}

tasks.named('assemble') { dependsOn coreProbeJar }
tasks.named('check') {
	dependsOn tasks.named('coreProbeTest'), tasks.named('coreProbeSmokeTest'),
		tasks.named('coreProbeAreaFadeSmokeTest'), tasks.named('coreProbeVolumeSmokeTest'),
		tasks.named('coreProbeClosedSmokeTest')
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}
	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
